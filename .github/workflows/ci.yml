name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Validate scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n src/voxsnip-clip.sh
          bash -n src/voxsnip-text.sh
          bash -n src/voxsnip-lib.sh
          bash -n src/voxsnip-uninstall.sh
          bash -n public/install.sh
          python3 -m py_compile src/voxsnip-portal.py
          python3 -m json.tool src/voxsnip-extension.json >/dev/null
          node --check --input-type=module < src/voxsnip-extension.js
      - name: Source copies match
        run: |
          cmp src/voxsnip-clip.sh public/voxsnip-clip.sh
          cmp src/voxsnip-text.sh public/voxsnip-text.sh
          cmp src/voxsnip-lib.sh public/voxsnip-lib.sh
          cmp src/voxsnip-portal.py public/voxsnip-portal.py
          cmp src/voxsnip-uninstall.sh public/voxsnip-uninstall.sh
          cmp src/voxsnip-extension.js public/voxsnip-extension.js
          cmp src/voxsnip-extension.json public/voxsnip-extension.json
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: src
          additional_files: public/install.sh
        env:
          SHELLCHECK_OPTS: --severity=warning
